name: Unit tests

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Release tooling tests
        run: |
          for t in .github/scripts/*.test.sh; do
            bash "$t"
          done

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          architecture: 'x64'
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependencies
        run: flutter pub deps

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Enforce 94% coverage threshold
        run: |
          awk 'BEGIN{t=0;h=0} /^LF:/{t+=substr($0,4)} /^LH:/{h+=substr($0,4)} END{
            pct=(t>0)?(h*100.0/t):0
            printf "Coverage: %.1f%%\n", pct
            if (pct < 94) { print "FAIL: coverage below 94% threshold"; exit 1 }
            print "PASS: coverage meets 94% threshold"
          }' coverage/lcov.info

      - name: Check publish warnings
        run: dart pub publish --dry-run

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
