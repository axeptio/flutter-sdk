name: Unit tests

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          architecture: 'x64'
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependencies
        run: flutter pub deps

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Enforce 95% coverage threshold
        run: |
          awk 'BEGIN{t=0;h=0} /^LF:/{t+=substr($0,4)} /^LH:/{h+=substr($0,4)} END{
            pct=(t>0)?(h*100.0/t):0
            printf "Coverage: %.1f%%\n", pct
            if (pct < 95) { print "FAIL: coverage below 95% threshold"; exit 1 }
            print "PASS: coverage meets 95% threshold"
          }' coverage/lcov.info

      - name: Check publish warnings
        run: dart pub publish --dry-run

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
