name: Semantic Version Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (leave empty for automatic detection based on conventional commits)'
        required: false
        type: choice
        options:
          - ''
          - 'patch'
          - 'minor'
          - 'major'
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          architecture: 'x64'
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install semantic-release dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Run semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.release_type }}" ]; then
            echo "Manual release type specified: ${{ github.event.inputs.release_type }}"
            case "${{ github.event.inputs.release_type }}" in
              "patch")
                npx semantic-release --no-ci --debug --release-as patch
                ;;
              "minor")
                npx semantic-release --no-ci --debug --release-as minor
                ;;
              "major")
                npx semantic-release --no-ci --debug --release-as major
                ;;
            esac
          else
            echo "Automatic release type detection based on conventional commits"
            npx semantic-release --no-ci --debug
          fi

      - name: Verify package
        run: dart pub publish --dry-run

      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Semantic versioning completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "📦 Package validated and ready for publishing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the generated release and changelog" >> $GITHUB_STEP_SUMMARY
          echo "2. Use the publish workflow to deploy to pub.dev" >> $GITHUB_STEP_SUMMARY
